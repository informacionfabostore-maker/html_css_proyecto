<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Checkout CampusShop" />
    <title>CampusShop | Checkout</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a
            class="icon-button"
            href="carrito.html"
            aria-label="Volver al carrito"
            >←</a
          ><a class="brand" href="index.html"><img src="imagenes/logo.png.svg" alt="CampusShop" /><span>CampusShop</span></a
          ><span class="text-link">Checkout</span>
        </div>
      </header>
      <main class="page-main">
        <div class="container checkout-layout">
          <section>
            <div class="page-heading">
              <h1>Envio</h1>
              <p>Completa tus datos para recibir tu pedido.</p>
            </div>
            <form class="panel form-grid" action="historial.html" method="get">
              <div class="field">
                <label for="name">Nombre completo</label
                ><input
                  id="name"
                  name="name"
                  type="text"
                  placeholder="Ingresa tu nombre completo"
                  required
                />
              </div>
              <div class="field">
                <label for="address">Direccion</label
                ><input
                  id="address"
                  name="address"
                  type="text"
                  placeholder="Ingresa tu direccion"
                  required
                />
              </div>
              <div class="field">
                <label for="city">Ciudad</label
                ><input
                  id="city"
                  name="city"
                  type="text"
                  placeholder="Tu ciudad"
                  required
                />
              </div>
              <fieldset>
                <legend>Metodo de pago</legend>
                <div class="payment-options">
                  <label class="payment-option selected"
                    ><input
                      class="visually-hidden"
                      type="radio"
                      name="payment"
                      value="card"
                      checked
                    /><span class="payment-mark payment-mark-card" aria-hidden="true">CARD</span
                    ><small>Tarjeta</small></label
                  ><label class="payment-option"
                    ><input
                      class="visually-hidden"
                      type="radio"
                      name="payment"
                      value="mastercard"
                    /><span class="payment-mark payment-mark-mastercard" aria-hidden="true"><i></i><i></i></span
                    ><small>Mastercard</small></label
                  ><label class="payment-option"
                    ><input
                      class="visually-hidden"
                      type="radio"
                      name="payment"
                      value="paypal"
                    /><span class="payment-mark payment-mark-paypal" aria-hidden="true">P</span
                    ><small>PayPal</small></label
                  >
                </div>
              </fieldset>
              <button class="button button-primary" type="submit">
                Pagar $3.450.643
              </button>
            </form>
          </section>
          <aside class="panel order-summary">
            <h2>Resumen de tu orden</h2>
            <div class="checkout-product">
              <img src="imagenes/ideapad-slim-3 (1).jpg" alt="Lenovo IdeaPad Slim 3" />
              <div class="summary-line">
                <span>IdeaPad Slim 3<br /><small>Cantidad: 1</small></span
                ><strong>$1.699.900</strong>
              </div>
            </div>
            <div class="checkout-product">
              <img src="imagenes/airpods-4.jpg" alt="Apple AirPods 4" />
              <div class="summary-line">
                <span>AirPods 4<br /><small>Cantidad: 1</small></span
                ><strong>$699.900</strong>
              </div>
            </div>
            <div class="checkout-product">
              <img src="imagenes/samsung-t7-shield (1).jpg" alt="Samsung T7 Shield" />
              <div class="summary-line">
                <span>T7 Shield<br /><small>Cantidad: 1</small></span
                ><strong>$499.900</strong>
              </div>
            </div>
            <div class="summary-line total">
              <span>Total</span><strong>$3.450.643</strong>
            </div>
          </aside>
        </div>
      </main>
      <nav class="bottom-nav" aria-label="Navegacion movil">
        <a href="index.html"><span>⌂</span>Inicio</a
        ><a href="catalogo.html"><span>▦</span>Categorias</a
        ><a href="carrito.html"><span>🛒</span>Carrito</a
        ><a href="historial.html"><span>▣</span>Pedidos</a
        ><a href="perfil.html"><span>♙</span>Perfil</a>
      </nav>
    </div>
  </body>
</html>
